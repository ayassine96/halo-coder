# Unit tests for halo-factory-floor chart
suite: factory-floor defaults
templates:
  - templates/deployment.yaml
  - templates/ingress.yaml
tests:
  - it: renders Deployment with defaults
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: halo-factory-floor
      - equal:
          path: spec.replicas
          value: 1

  - it: renders Service
    template: templates/deployment.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: Service
      - equal:
          path: metadata.name
          value: halo-factory-floor

  - it: renders Ingress
    template: templates/ingress.yaml
    asserts:
      - equal:
          path: kind
          value: Ingress
      - equal:
          path: metadata.name
          value: halo-factory-floor

  - it: sets correct container port
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8888

  - it: has liveness probe
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8888