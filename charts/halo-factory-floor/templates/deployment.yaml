apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-factory-floor
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: halo-factory-floor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halo-factory-floor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halo-factory-floor
    spec:
      containers:
        - name: factory-floor
          image: {{ .Values.factoryFloor.image }}
          ports:
            - containerPort: 8888
          env:
            - name: HALO_REDIS_URL
              value: {{ .Values.redis.url | quote }}
          {{- with .Values.factoryFloor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: halo-factory-floor
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: halo-factory-floor
  ports:
    - port: 8888
      targetPort: 8888