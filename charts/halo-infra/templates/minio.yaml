{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-minio
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: halo-minio
    app.kubernetes.io/part-of: halo-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halo-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halo-minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":{{ .Values.minio.port }}"]
          ports:
            - containerPort: {{ .Values.minio.apiPort }}
              name: api
            - containerPort: {{ .Values.minio.port }}
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.minio.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: halo-minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: halo-minio
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: halo-minio
    app.kubernetes.io/part-of: halo-infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.minio.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: halo-minio
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: halo-minio
    app.kubernetes.io/part-of: halo-infra
spec:
  selector:
    app.kubernetes.io/name: halo-minio
  ports:
    - name: api
      port: {{ .Values.minio.apiPort }}
      targetPort: {{ .Values.minio.apiPort }}
    - name: console
      port: {{ .Values.minio.port }}
      targetPort: {{ .Values.minio.port }}
{{- end }}