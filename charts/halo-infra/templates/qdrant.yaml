{{- if .Values.qdrant.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-qdrant
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: halo-qdrant
    app.kubernetes.io/part-of: halo-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halo-qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halo-qdrant
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - containerPort: {{ .Values.qdrant.port }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          {{- with .Values.qdrant.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: halo-qdrant
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: halo-qdrant
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: halo-qdrant
    app.kubernetes.io/part-of: halo-infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.qdrant.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: halo-qdrant
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: halo-qdrant
    app.kubernetes.io/part-of: halo-infra
spec:
  selector:
    app.kubernetes.io/name: halo-qdrant
  ports:
    - port: {{ .Values.qdrant.port }}
      targetPort: {{ .Values.qdrant.port }}
{{- end }}